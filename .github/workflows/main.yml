name: Build Mess Manager

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python from python.org (it includes Tkinter and works on Intel and Apple Silicon)
        run: |
          curl -fL -o python.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python.pkg -target /
          /usr/local/bin/python3.12 -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build Mess Manager.app
        run: |
          SRC="$(find . -name run_mess_manager.py -not -path '*/.git/*' | head -1)"
          if [ -z "$SRC" ]; then echo "run_mess_manager.py is missing: upload the game files first."; exit 1; fi
          cd "$(dirname "$SRC")"
          PY=/usr/local/bin/python3.12
          $PY -m pip install pyinstaller certifi
          $PY -m PyInstaller --noconfirm --windowed --target-arch universal2 \
              --name "Mess Manager" --collect-submodules messmanager run_mess_manager.py
          ditto -c -k --keepParent "dist/Mess Manager.app" "$GITHUB_WORKSPACE/Mess Manager (Mac).zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Mess-Manager-Mac
          path: "Mess Manager (Mac).zip"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Mess Manager.exe
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse -Filter run_mess_manager.py | Where-Object { $_.FullName -notmatch '\\.git\\' } | Select-Object -First 1
          if (-not $src) { Write-Error "run_mess_manager.py is missing: upload the game files first."; exit 1 }
          Set-Location $src.DirectoryName
          python -m pip install pyinstaller pillow certifi
          python -m PyInstaller --noconfirm --windowed --onefile --name "Mess Manager" --collect-submodules messmanager --hidden-import PIL._tkinter_finder run_mess_manager.py
          Move-Item "dist\Mess Manager.exe" "$env:GITHUB_WORKSPACE\Mess Manager.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Mess-Manager-Windows
          path: "Mess Manager.exe"
